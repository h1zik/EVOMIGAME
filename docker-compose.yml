# Menjalankan game dan databasenya di satu VPS.
# Isi file .env dulu (lihat .env.example), lalu: docker compose up -d --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: versiku
      POSTGRES_USER: versiku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Isi POSTGRES_PASSWORD di file .env}
    volumes:
      - data-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U versiku -d versiku"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      args:
        BASE_URL: ${BASE_URL:?Isi BASE_URL di file .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BASE_URL: ${BASE_URL}
      DATABASE_URL: postgres://versiku:${POSTGRES_PASSWORD}@db:5432/versiku
      SIDIK_SALT: ${SIDIK_SALT:?Isi SIDIK_SALT di file .env}
      ADMIN_KEY: ${ADMIN_KEY:-}
    # Hanya dibuka ke mesin ini. HTTPS dan domain diurus reverse proxy (lihat README).
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  data-db:
